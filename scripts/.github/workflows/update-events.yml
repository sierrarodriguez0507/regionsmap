name: Update Mobilize events

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch events from Mobilize
        run: python scripts/fetch_events.py
      - name: Save events.json if it changed
        run: |
          git config user.name "turf-finder-bot"
          git config user.email "turf-finder-bot@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Mobilize events"
            git push
          fi
