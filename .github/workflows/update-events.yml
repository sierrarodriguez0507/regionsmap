name: Update Mobilize events

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # adds a "Run workflow" button
  push:
    branches: [main]
    paths: [event-edits.json]   # rebuild right after someone saves edits on the event list page

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch events from Mobilize (map)
        run: python scripts/fetch_events.py
      - name: Build the event list (one row per shift, by team)
        if: always()
        env:
          # Optional. Add this repo secret to get event contact info and private events.
          MOBILIZE_API_KEY: ${{ secrets.MOBILIZE_API_KEY }}
        run: python scripts/fetch_event_list.py
      - name: Save the files that changed
        if: always()
        run: |
          git config user.name "turf-finder-bot"
          git config user.email "turf-finder-bot@users.noreply.github.com"
          git add events.json
          if [ -f event-list.json ]; then git add event-list.json event-list.csv; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Mobilize events"
            git pull --rebase
            git push
          fi
